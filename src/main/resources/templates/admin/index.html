<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Corporate Food Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>

            <li><a th:href="${apiBase + '/companies'}">Companies</a></li>

            <li><a th:href="${apiBase + '/foods'}">Foods (reference template)</a></li>

            <li><a th:href="${apiBase + '/weekly-menus'}">Weekly Menus</a></li>

</html>

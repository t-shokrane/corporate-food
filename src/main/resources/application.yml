spring:
  application:
    name: corporate-food

  datasource:
    url: jdbc:mysql://localhost:3306/corporate_food?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8081
  servlet:
    context-path: /

logging:
  level:
    com.corporate.food: INFO
    org.hibernate.SQL: WARN

app:
  security:
    # Disable auth for local dev; set to true in production
    enabled: false

    server:
      error:
        include-message: always
        include-stacktrace: always
